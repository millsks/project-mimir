# Project identification
sonar.projectKey=millsks_project-mimir
sonar.organization=millsks
sonar.projectName=project-mimir
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=project_mimir
sonar.tests=tests

# Language-specific settings
sonar.language=py
sonar.python.coverage.reportPaths=coverage.xml

# JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/__pycache__/**, **/*.pyc, **/node_modules/**, **/dist/**, **/build/**

# Additional settings
sonar.test.inclusions=**/tests/**, **/*.test.js
sonar.test.exclusions=**/__pycache__/**, **/*.pyc, **/node_modules/**, **/dist/**, **/build/**
